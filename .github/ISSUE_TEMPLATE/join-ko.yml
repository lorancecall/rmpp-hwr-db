name: "Join: 한국어 (Korean)"
description: 한국어 + 영어 + 숫자 손글씨로 공개 데이터셋에 참여 신청과 동의 / Join writing Korean + English + digits
title: "[join] Korean / 한국어 (ko)"
labels: ["join", "lang:ko"]
body:
  - type: markdown
    attributes:
      value: |
        reMarkable Paper Pro로 쓴 손글씨(펜 획)를 **공개 데이터셋**에 기여하기 위한 신청입니다.
        안내: https://lorancecall.github.io/rmpp-hwr-db/?lang=ko

        이 이슈는 **공개**됩니다. 이름, 연락처 같은 개인 정보는 적지 마세요.
        (This issue is public: do not write personal information.)
  - type: dropdown
    id: language
    attributes:
      label: Language you write / 쓰는 언어
      description: |
        이 양식에서 정해집니다. 연습 노트는 한국어에 영어와 숫자를 섞습니다. 다른 언어라면 돌아가서 고르세요:
        https://lorancecall.github.io/rmpp-hwr-db/?lang=ko#start
      options:
        - "Korean / 한국어 (ko)"
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 동의 사항 (모두 필요) / Consent (all five are required)
      options:
        - label: 제출하는 데이터가 CC BY 4.0으로 공개되어, 출처를 밝히면 누구나(상업적 이용 포함) 사용·수정·재배포할 수 있다는 데 동의합니다. / My data is published under CC BY 4.0.
          required: true
        - label: 연습 페이지에 인쇄된 문장만 따라 썼고 개인 정보(이름, 연락처, 주소)는 쓰지 않았습니다. 그런 글씨가 있는 페이지는 제출하지 않습니다. / Only the printed sentences, no personal information.
          required: true
        - label: 데이터에는 무작위 작성자 ID만 들어가지만, 이 이슈와 PR을 연 GitHub 계정은 공개된다는 점을 이해합니다. / My GitHub account is public.
          required: true
        - label: 만 14세 이상입니다. / I am at least 14 years old.
          required: true
        - label: 철회하면 이후 버전에서 삭제되지만, 이미 공개된 이전 버전과 다른 사람이 받아 간 사본은 회수할 수 없다는 점을 이해합니다. / Withdrawal cannot recall earlier versions or copies.
          required: true
  - type: dropdown
    id: hand
    attributes:
      label: 주로 쓰는 손 (선택, 공개됨) / Writing hand (optional, public)
      options: ["응답 안 함 / no answer", "오른손 / right", "왼손 / left", "양손 / both"]
    validations:
      required: false
  - type: dropdown
    id: age
    attributes:
      label: 연령대 (선택, 공개됨) / Age range (optional, public)
      options: ["응답 안 함 / no answer", "10-19", "20-29", "30-39", "40-49", "50-59", "60+"]
    validations:
      required: false
