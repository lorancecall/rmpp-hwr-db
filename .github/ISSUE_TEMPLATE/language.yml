name: Add a language / 언어 추가 요청
description: Ask for practice pages and a data folder for another language (언어 추가 요청)
title: "[language] "
labels: ["language-request"]
body:
  - type: markdown
    attributes:
      value: |
        Every notebook practises **your language + English + digits** (for English writers: English + digits), and
        each language has its own folder `data/<code>/`. Supported now: see [languages.json](../blob/main/languages.json).
        This issue is **public**: do not write personal information.

        노트는 **내 언어 + 영어 + 숫자**를 함께 연습하고, 언어마다 `data/<코드>/` 폴더가 따로 있습니다. 이 이슈는 공개됩니다.
  - type: dropdown
    id: language
    attributes:
      label: Language / 언어
      description: |
        Languages most handwriting tools support (reMarkable's own conversion, Apple, Google). Not in the list:
        leave this empty (or pick Other) and write the code and name in the next field.
        Supported already: https://lorancecall.github.io/rmpp-hwr-db/#start
        목록에 없으면 비워 두고(또는 기타) 다음 칸에 코드와 이름을 적으세요.
      options:
        - "Japanese / 日本語 (ja)"
        - "Chinese, Simplified / 简体中文 (zh)"
        - "Chinese, Traditional / 繁體中文 (zh-hant)"
        - "German / Deutsch (de)"
        - "French / Français (fr)"
        - "Spanish / Español (es)"
        - "Portuguese / Português (pt)"
        - "Italian / Italiano (it)"
        - "Dutch / Nederlands (nl)"
        - "Swedish / Svenska (sv)"
        - "Danish / Dansk (da)"
        - "Norwegian / Norsk (no)"
        - "Finnish / Suomi (fi)"
        - "Polish / Polski (pl)"
        - "Czech / Čeština (cs)"
        - "Russian / Русский (ru)"
        - "Ukrainian / Українська (uk)"
        - "Greek / Ελληνικά (el)"
        - "Turkish / Türkçe (tr)"
        - "Vietnamese / Tiếng Việt (vi)"
        - "Other (code below) / 기타"
    validations:
      required: false
  - type: input
    id: other
    attributes:
      label: Other language - ISO 639-1 code and name / 목록에 없는 언어 - 코드와 이름
      description: |
        Only when the list above has no choice. Two lowercase letters
        (https://en.wikipedia.org/wiki/List_of_ISO_639_language_codes), the English name, then the language's own
        name. The site's "My language isn't listed" search fills this in. A bot checks the code.
      placeholder: "ka Georgian / ქართული"
    validations:
      required: false
  - type: textarea
    id: script
    attributes:
      label: Writing system / 문자 체계
      description: |
        Which characters should the practice pages cover? One character per grid cell works for scripts like
        Hangul, kana or Chinese characters; Latin-script languages use English-style four-line rows.
        연습 페이지에 들어갈 문자 (예: 히라가나·가타카나·상용 한자 2,136자).
    validations:
      required: true
  - type: textarea
    id: texts
    attributes:
      label: Practice texts / 연습 문장 출처
      description: |
        Where can sentences to copy come from? They must be public domain or openly licensed (CC0, CC BY, ...):
        give links. You can also attach your own sentences if you agree to release them under CC BY 4.0.
        따라 쓸 문장의 출처 (퍼블릭 도메인이나 공개 라이선스, 링크 포함).
    validations:
      required: true
  - type: checkboxes
    id: writer
    attributes:
      label: Contributing / 참여
      options:
        - label: I have a reMarkable Paper Pro and would write practice pages in this language. / 이 언어로 연습 페이지를 쓸 수 있습니다.
          required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes / 기타
    validations:
      required: false
