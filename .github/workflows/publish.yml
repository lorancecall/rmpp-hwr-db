name: Publish (web page, Hugging Face mirror)

# On every merge to main: statistics -> GitHub Pages site (docs/), and a mirror of the data on the
# Hugging Face Hub when the HF_TOKEN secret is set (dataset id: repository variable HF_DATASET_REPO,
# default lorancecall/rmpp-hwr-db).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/validate.py --all
          mkdir -p site && cp -r docs/. site/ && cp languages.json site/ && python scripts/stats.py > site/stats.json && cat site/stats.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  # Hugging Face mirror. Turn it on by setting the repository variable HF_DATASET_REPO (e.g. yourname/rmpp-hwr-db)
  # after creating that dataset on the Hub and adding this workflow as its Trusted Publisher (dataset Settings >
  # Trusted Publishers: GitHub Actions, repository lorancecall/rmpp-hwr-db, branch main, workflow publish.yml).
  # No token is stored: the job exchanges its GitHub OIDC token for a 1-hour token scoped to that one dataset.
  # (An HF_TOKEN secret, if set, is used instead.)
  huggingface:
    if: vars.HF_DATASET_REPO != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets the job request a GitHub OIDC token for the exchange
      contents: read
    env:
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
      HF_OIDC_RESOURCE: datasets/${{ vars.HF_DATASET_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mirror to the Hugging Face Hub
        env:
          HF_TOKEN_SECRET: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q "huggingface_hub>=1.19.0"
          if [ -n "$HF_TOKEN_SECRET" ]; then export HF_TOKEN="$HF_TOKEN_SECRET"; else export HF_TOKEN="$(hf auth token)"; fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = os.environ["HF_DATASET_REPO"]
          api.upload_file(path_or_fileobj="docs/hf-README.md", path_in_repo="README.md", repo_id=repo, repo_type="dataset",
                          commit_message="Dataset card")
          api.upload_folder(folder_path=".", repo_id=repo, repo_type="dataset",
                            allow_patterns=["data/**", "languages.json", "LICENSE", "FORMAT.md"],
                            delete_patterns=["writers/**", "data/**"],
                            commit_message=f"Mirror of {os.environ['GITHUB_SHA'][:7]}")
          print(f"mirrored to https://huggingface.co/datasets/{repo}")
          PY
