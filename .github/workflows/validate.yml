name: Validate contribution

on:
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check format, privacy and consent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin ${{ github.base_ref }}
          python scripts/validate.py --base origin/${{ github.base_ref }} --author "${{ github.event.pull_request.user.login }}"
