name: Consent check

# A join issue whose five consent boxes are all ticked gets the `consent-approved` label and a comment with
# the next steps. Validation of pull requests requires that label.
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  consent:
    if: contains(github.event.issue.labels.*.name, 'join')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const checked = (body.match(/- \[[xX]\]/g) || []).length;
            const num = context.payload.issue.number;
            const labels = context.payload.issue.labels.map(l => l.name);
            // Language of the join form ("... (code)" under "Language you write"): label lang:<code>. The
            // per-language forms carry that label already, but a template label is dropped when it does not exist.
            const lang = (body.match(/^###\s*Language you write[^\n]*\n\s*\n[^\n]*\(([a-z]{2}(?:-[a-z]{2,4})?)\)\s*$/m) || [])[1];
            if (lang && !labels.includes(`lang:${lang}`)) {
              try { await github.rest.issues.createLabel({ ...context.repo, name: `lang:${lang}`, color: "C5DEF5" }); } catch (e) {}
              await github.rest.issues.addLabels({ ...context.repo, issue_number: num, labels: [`lang:${lang}`] });
            }
            if (checked >= 5 && !labels.includes("consent-approved")) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: num, labels: ["consent-approved"] });
              await github.rest.issues.createComment({ ...context.repo, issue_number: num, body:
                `Thank you, your consent is recorded! / 참여 신청이 확인되었습니다. 감사합니다!\n\n` +
                `Next, on your computer / 다음 단계 (PC에서):\n` +
                "```\nhwr contribute --consent " + num + "\n```\n" +
                `\`--consent ${num}\` is needed the first time only / 처음 한 번만 붙이면 됩니다. ` +
                `Guide: https://lorancecall.github.io/rmpp-hwr-db/#join (한국어: https://lorancecall.github.io/rmpp-hwr-db/?lang=ko#join)` });
            } else if (checked < 5) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: num, body:
                `All five consent items are needed to join (${checked} ticked): edit the issue to tick them. / ` +
                `동의 항목 5개를 모두 확인해야 참여할 수 있습니다 (현재 ${checked}개). 이슈를 편집해 확인해 주세요.` });
            }
