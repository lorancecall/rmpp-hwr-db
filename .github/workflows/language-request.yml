name: Language request

# An "Add a language" issue (the issue form, or a blank issue from the site's request form, which carries the
# marker rmpp-hwr-db:language-request): read the language from the form and check its code (ISO 639-1,
# scripts/languages.py), label the issue lang:<code> and reply with what rmpp-hwr can do for it (support tier).
# A new language then collects practice sentences (sentences.yml checks those in this issue and later ones); at 100
# sentences sentences.yml registers it (languages.json, join form) and closes its requests.
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

concurrency:
  group: language-request-${{ github.event.issue.number }}

jobs:
  check:
    # the form's label, or the marker of the site's request form (a blank issue: no template, so no label)
    if: contains(github.event.issue.labels.*.name, 'language-request') || contains(github.event.issue.body, 'rmpp-hwr-db:language-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/languages.py check-issue
      - name: Label and reply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.check.outputs.code }}
          COMMENT: ${{ steps.check.outputs.comment }}
          NUM: ${{ github.event.issue.number }}
          EVENT: ${{ github.event.action }}
        run: |
          gh issue edit "$NUM" -R "$GITHUB_REPOSITORY" --add-label language-request
          if [ -n "$CODE" ]; then
            gh label create "lang:$CODE" -R "$GITHUB_REPOSITORY" --color C5DEF5 2>/dev/null || true
            gh issue edit "$NUM" -R "$GITHUB_REPOSITORY" --add-label "lang:$CODE"
          fi
          # reply once; an edit only gets a reply when the language could not be read before
          if [ "$EVENT" = "opened" ] || [ -z "$CODE" ] || ! gh issue view "$NUM" -R "$GITHUB_REPOSITORY" --json comments -q '.comments[].body' | grep -q "Requested:\|supported already"; then
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "$COMMENT"
          fi
